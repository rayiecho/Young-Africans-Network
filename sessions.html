<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Session Coordination | Young Africans Network</title>
<link rel="icon" href="/images/logo.jpeg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A6B;--red:#E63329;--gold:#F5A623;--white:#FFFFFF;--light:#F8F9FF;--gray:#6B7280;--dark:#0D1B4B;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--light);color:var(--navy);min-height:100vh;}
a{text-decoration:none;color:inherit;}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:900;}

nav{background:var(--white);box-shadow:0 2px 20px rgba(27,42,107,0.1);padding:0 2rem;height:70px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:0.75rem;}
.nav-logo img{height:42px;border-radius:50%;}
.nav-logo-text{font-size:0.85rem;font-weight:700;}
.nav-back{font-size:0.82rem;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:0.35rem;}

.hero{background:linear-gradient(135deg,var(--navy) 0%,#2D3F9B 100%);padding:2.75rem 1.25rem 3.5rem;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-40%;right:-8%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,0.18),transparent 70%);}
.hero::after{content:'';position:absolute;bottom:-60%;left:-5%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.06),transparent 70%);}
.hero-inner{max-width:900px;margin:0 auto;position:relative;z-index:1;}
.hero-icon{width:52px;height:52px;border-radius:14px;background:rgba(245,166,35,0.15);border:1.5px solid rgba(245,166,35,0.35);display:flex;align-items:center;justify-content:center;margin-bottom:1rem;}
.hero .page-title{color:#fff;font-size:1.9rem;margin-bottom:0.4rem;}
.hero .page-sub{color:rgba(255,255,255,0.68);font-size:0.9rem;margin-bottom:0;}

.wrap{max-width:900px;margin:-2rem auto 0;padding:0 1.25rem 4rem;position:relative;z-index:2;}
.page-title{font-size:1.8rem;margin-bottom:0.3rem;}
.page-sub{color:var(--gray);font-size:0.88rem;margin-bottom:1.75rem;}

.btn{border:none;border-radius:50px;font-family:'Poppins',sans-serif;font-weight:700;cursor:pointer;font-size:0.82rem;padding:0.6rem 1.3rem;transition:all 0.15s;}
.btn:hover{opacity:0.88;transform:translateY(-1px);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid rgba(27,42,107,0.2);}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;}

.card{background:#fff;border-radius:18px;padding:1.5rem;box-shadow:0 4px 20px rgba(27,42,107,0.07);margin-bottom:1.25rem;border-left:4px solid transparent;transition:box-shadow 0.15s;}
.card:hover{box-shadow:0 6px 28px rgba(27,42,107,0.11);}
.card.accent-awaiting{border-left-color:#9CA3AF;}
.card.accent-confirmed{border-left-color:#27AE60;}
.card.accent-needs_help{border-left-color:var(--red);}
.card.accent-completed{border-left-color:var(--navy);}
.card.accent-cancelled{border-left-color:#D1D5DB;}
.session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:0.75rem;}
.session-date{font-size:0.72rem;font-weight:700;color:var(--gold);letter-spacing:0.05em;text-transform:uppercase;}
.session-topic{font-size:1.15rem;font-weight:800;margin-top:0.25rem;font-family:'Playfair Display',serif;}
.session-dept{font-size:0.8rem;color:var(--gray);margin-top:0.2rem;}

.badge{display:inline-flex;align-items:center;gap:0.3rem;padding:0.3rem 0.85rem;border-radius:50px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-awaiting{background:rgba(107,114,128,0.12);color:var(--gray);}
.badge-confirmed{background:rgba(39,174,96,0.12);color:#27AE60;}
.badge-needs_help{background:rgba(230,51,41,0.1);color:var(--red);}
.badge-completed{background:rgba(27,42,107,0.1);color:var(--navy);}
.badge-cancelled{background:rgba(107,114,128,0.1);color:var(--gray);text-decoration:line-through;}

.section-label{font-size:0.7rem;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:0.06em;margin:1.1rem 0 0.6rem;display:flex;align-items:center;gap:0.4rem;}
.section-label::before{content:'';width:14px;height:2px;background:var(--gold);border-radius:2px;}
.pill{display:inline-flex;align-items:center;gap:0.4rem;background:var(--light);border:1px solid rgba(27,42,107,0.1);border-radius:50px;padding:0.35rem 0.85rem;font-size:0.78rem;margin:0 0.4rem 0.4rem 0;}
.pill.filled{background:rgba(39,174,96,0.08);border-color:rgba(39,174,96,0.25);}
.pill button{background:none;border:none;color:var(--red);font-size:0.72rem;font-weight:700;cursor:pointer;margin-left:0.3rem;}

.actions-row{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(27,42,107,0.06);}
.meet-link{display:inline-flex;align-items:center;gap:0.4rem;color:var(--navy);font-weight:700;font-size:0.82rem;margin-top:0.6rem;background:var(--light);padding:0.5rem 0.9rem;border-radius:10px;}

.empty{text-align:center;padding:3.5rem 1.5rem;color:var(--gray);background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,0.04);}
.empty-icon{width:52px;height:52px;margin:0 auto 1rem;opacity:0.35;}

.modal-overlay{position:fixed;inset:0;background:rgba(13,27,75,0.55);display:none;align-items:center;justify-content:center;padding:1rem;z-index:999;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px;padding:1.75rem;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:1.15rem;margin-bottom:1rem;}
.form-group{margin-bottom:0.9rem;}
.form-group label{display:block;font-size:0.78rem;font-weight:700;margin-bottom:0.35rem;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:0.65rem 0.85rem;border:1.5px solid rgba(27,42,107,0.15);border-radius:10px;font-family:'Poppins',sans-serif;font-size:0.85rem;outline:none;}
.form-group textarea{resize:vertical;min-height:70px;}
.modal-actions{display:flex;gap:0.6rem;justify-content:flex-end;margin-top:1.25rem;}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);color:#fff;padding:0.8rem 1.5rem;border-radius:50px;font-size:0.85rem;opacity:0;transition:all 0.3s;z-index:9999;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.error{background:var(--red);}

.loading{text-align:center;padding:2rem;color:var(--gray);font-size:0.85rem;}
</style>
</head>
<body>

<nav>
  <a href="community.html" class="nav-logo">
    <img src="images/logo.jpeg" alt="YAN">
    <span class="nav-logo-text">Young Africans<br>Network</span>
  </a>
  <a href="community.html" class="nav-back">&larr; Back to Community</a>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
    <h1 class="page-title">Session Coordination</h1>
    <p class="page-sub">Who's leading which session, and what they need to run it.</p>
  </div>
</div>

<div class="wrap">
  <p style="color:var(--gray);font-size:0.82rem;margin-bottom:1.5rem;">New sessions are posted weekly</p>

  <div id="sessions-list"><div class="loading">Loading sessions...</div></div>
</div>

<!-- NEEDS HELP MODAL -->
<div class="modal-overlay" id="needs-help-modal">
  <div class="modal">
    <h3>What do you need help with?</h3>
    <div class="form-group"><label>Type of help</label>
      <select id="nh-type">
        <option value="poster">Poster / Banner</option>
        <option value="video_edit">Video Edit</option>
        <option value="slides">Slides / Presentation</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group"><label>Details (this becomes a Volunteer Room task)</label><textarea id="nh-note" placeholder="e.g. Need a poster designed for this session's theme..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('needs-help-modal')">Cancel</button>
      <button class="btn btn-red" id="nh-submit" onclick="submitNeedsHelp()">Flag & Request Help</button>
    </div>
  </div>
</div>

<!-- ADD ROLE MODAL -->
<div class="modal-overlay" id="add-role-modal">
  <div class="modal">
    <h3>Add a Volunteer Role</h3>
    <div class="form-group"><label>Role name</label><input type="text" id="ar-name" placeholder="e.g. Tech Support, Photographer, MC"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('add-role-modal')">Cancel</button>
      <button class="btn btn-primary" id="ar-submit" onclick="submitAddRole()">Add Role</button>
    </div>
  </div>
</div>

<!-- ADD GUEST MODAL -->
<div class="modal-overlay" id="add-guest-modal">
  <div class="modal">
    <h3>Add a Guest Speaker</h3>
    <div class="form-group"><label>Name</label><input type="text" id="ag-name"></div>
    <div class="form-group"><label>Contact (optional)</label><input type="text" id="ag-contact"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('add-guest-modal')">Cancel</button>
      <button class="btn btn-primary" id="ag-submit" onclick="submitAddGuest()">Add Guest</button>
    </div>
  </div>
</div>

<!-- ATTENDANCE MODAL -->
<div class="modal-overlay" id="attendance-modal">
  <div class="modal">
    <h3 id="att-title">Attendance</h3>
    <div id="att-list" style="max-height:50vh;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('attendance-modal')">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/assets/yan-api.js?v=1785945640"></script>
<script>
let currentUser = null;
let activeSessionForModal = null;
const DEPT_NAMES = {programs:'Programs & Training',scholarships:'Scholarships & Global Opportunities',career:'Career Development & Public Speaking',community:'Community Impact & Volunteering',mental:'Mental Health & Wellbeing',communications:'Communications & Media',finance:'Finance & Administration',partnerships:'Partnership & External Relations'};

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function fmtDate(iso) {
  try { return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
  catch(e) { return iso; }
}
function timeAgoOrIn(iso) {
  const days = Math.round((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Tomorrow';
  if (days > 1) return 'In ' + days + ' days';
  if (days === -1) return 'Yesterday';
  return Math.abs(days) + ' days ago';
}

async function init() {
  currentUser = await YanAPI.me();
  if (!currentUser) { window.location.href = 'community.html'; return; }
  await loadSessions();
}

async function loadSessions() {
  const list = document.getElementById('sessions-list');
  try {
    const sessions = await YanAPI.getSessions();
    if (!sessions.length) {
      list.innerHTML = '<div class="empty"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="#1B2A6B" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><p>No sessions scheduled yet.</p></div>';
      return;
    }
    // Grouped by month so the list stays readable as it grows.
    const groups = {};
    sessions.forEach(s => {
      const monthKey = s.sessionDate.slice(0, 7);
      (groups[monthKey] = groups[monthKey] || []).push(s);
    });
    list.innerHTML = Object.keys(groups).sort().map(monthKey => {
      const label = new Date(monthKey + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      return `<h3 style="font-size:0.85rem;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:0.04em;margin:1.5rem 0 0.75rem;">${label}</h3>`
        + groups[monthKey].map(renderSessionCard).join('');
    }).join('');
  } catch(e) {
    list.innerHTML = '<div class="empty">Could not load sessions: ' + (e.message||'') + '</div>';
  }
}

function renderSessionCard(s) {
  const isMyHead = currentUser.id === s.assignedHeadId;
  const canManage = isMyHead || currentUser.isAdmin;
  const deptName = DEPT_NAMES[s.department] || s.department;

  const guestsHtml = s.guests.length ? s.guests.map(g =>
    `<span class="pill${g.confirmed?' filled':''}">${escapeHtml(g.name)}${g.confirmed?' ✓':''}${canManage && !g.confirmed ? `<button onclick="confirmGuest('${s.id}','${g.id}')">confirm</button>` : ''}</span>`
  ).join('') : '<span style="color:var(--gray);font-size:0.8rem;">None added yet</span>';

  const rolesHtml = s.roles.length ? s.roles.map(r => {
    const mine = r.filledBy === currentUser.id;
    const label = r.filledBy ? `${escapeHtml(r.roleName)} — ${escapeHtml(r.filledByName || 'filled')}` : `${escapeHtml(r.roleName)} (open)`;
    return `<span class="pill${r.filledBy?' filled':''}">${label}${(!r.filledBy || mine) ? `<button onclick="claimRole('${s.id}','${r.id}')">${mine?'release':'claim'}</button>` : ''}</span>`;
  }).join('') : '<span style="color:var(--gray);font-size:0.8rem;">None defined yet</span>';

  return `
  <div class="card accent-${s.status}">
    <div class="session-head">
      <div>
        <div class="session-date">${fmtDate(s.sessionDate)} · ${timeAgoOrIn(s.sessionDate)}</div>
        <div class="session-topic">${escapeHtml(s.topic)}</div>
        <div class="session-dept">${deptName}${s.assignedHeadName ? ' · Led by ' + escapeHtml(s.assignedHeadName) : ''}</div>
      </div>
      <span class="badge badge-${s.status}">${s.status.replace('_',' ')}</span>
    </div>
    ${s.meetLink ? `<a class="meet-link" href="${escapeHtml(s.meetLink)}" target="_blank">🔗 Join Google Meet</a>` : ''}
    ${s.needsAssistance ? `<div style="background:rgba(230,51,41,0.06);border-radius:10px;padding:0.75rem;margin-top:0.75rem;font-size:0.82rem;color:var(--red);"><strong>Needs help:</strong> ${escapeHtml(s.assistanceNote||'')}</div>` : ''}

    <div class="section-label">Guest Speakers</div>
    <div>${guestsHtml}</div>

    <div class="section-label">Volunteer Roles</div>
    <div>${rolesHtml}</div>

    <div class="actions-row">
      ${canManage && s.status === 'awaiting_confirmation' ? `<button class="btn btn-primary" onclick="confirmSession('${s.id}')">Confirm We're Running This</button>` : ''}
      ${canManage && !s.prepComplete ? `<button class="btn btn-outline" onclick="markPrepComplete('${s.id}')">Mark Prep Complete</button>` : ''}
      ${canManage ? `<button class="btn btn-outline" onclick="openAddGuestModal('${s.id}')">+ Guest</button>` : ''}
      ${canManage ? `<button class="btn btn-outline" onclick="openAddRoleModal('${s.id}')">+ Role</button>` : ''}
      ${canManage && !s.needsAssistance ? `<button class="btn btn-red" onclick="openNeedsHelpModal('${s.id}')">Request Help</button>` : ''}
      ${canManage ? `<button class="btn btn-outline" onclick="viewAttendance('${s.id}', '${escapeHtml(s.topic)}')">Attendance (${s.attendanceCount})</button>` : ''}
      <button class="btn btn-gold" onclick="checkIn('${s.id}')">I'm Here — Check In</button>
      ${currentUser.isAdmin ? `<button class="btn btn-outline" style="color:var(--red);" onclick="deleteSession('${s.id}')">Delete</button>` : ''}
    </div>
  </div>`;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = String(str == null ? '' : str);
  return d.innerHTML;
}

async function confirmSession(id) {
  try { await YanAPI.confirmSession(id); showToast('Confirmed!'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
}
async function markPrepComplete(id) {
  try { await YanAPI.markSessionPrepComplete(id); showToast('Prep marked complete'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
}
function openNeedsHelpModal(id) { activeSessionForModal = id; document.getElementById('nh-note').value = ''; openModal('needs-help-modal'); }
async function submitNeedsHelp() {
  const note = document.getElementById('nh-note').value.trim();
  const taskType = document.getElementById('nh-type').value;
  if (!note) return showToast('Describe what you need', 'error');
  const btn = document.getElementById('nh-submit');
  btn.disabled = true;
  try {
    await YanAPI.flagSessionNeedsHelp(activeSessionForModal, note, taskType);
    closeModal('needs-help-modal');
    showToast('Help requested — a task was posted to the Volunteer Room');
    await loadSessions();
  } catch(e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; }
}
function openAddRoleModal(id) { activeSessionForModal = id; document.getElementById('ar-name').value = ''; openModal('add-role-modal'); }
async function submitAddRole() {
  const roleName = document.getElementById('ar-name').value.trim();
  if (!roleName) return showToast('Enter a role name', 'error');
  const btn = document.getElementById('ar-submit');
  btn.disabled = true;
  try { await YanAPI.addSessionRole(activeSessionForModal, roleName); closeModal('add-role-modal'); showToast('Role added'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; }
}
function openAddGuestModal(id) { activeSessionForModal = id; document.getElementById('ag-name').value = ''; document.getElementById('ag-contact').value = ''; openModal('add-guest-modal'); }
async function submitAddGuest() {
  const name = document.getElementById('ag-name').value.trim();
  const contact = document.getElementById('ag-contact').value.trim();
  if (!name) return showToast('Enter a guest name', 'error');
  const btn = document.getElementById('ag-submit');
  btn.disabled = true;
  try { await YanAPI.addSessionGuest(activeSessionForModal, name, contact); closeModal('add-guest-modal'); showToast('Guest added'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; }
}
async function confirmGuest(sessionId, guestId) {
  try { await YanAPI.confirmSessionGuest(sessionId, guestId); showToast('Guest confirmed'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
}
async function claimRole(sessionId, roleId) {
  try { await YanAPI.claimSessionRole(sessionId, roleId); showToast('Updated!'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
}
async function checkIn(sessionId) {
  try { await YanAPI.checkInSession(sessionId); showToast('Checked in!'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
}
async function viewAttendance(sessionId, topic) {
  document.getElementById('att-title').textContent = 'Attendance — ' + topic;
  document.getElementById('att-list').innerHTML = '<div class="loading">Loading...</div>';
  openModal('attendance-modal');
  try {
    const attendance = await YanAPI.getSessionAttendance(sessionId);
    document.getElementById('att-list').innerHTML = attendance.length
      ? attendance.map(a => `<div style="padding:0.6rem 0;border-bottom:1px solid rgba(27,42,107,0.08);font-size:0.88rem;">${escapeHtml(a.name)}</div>`).join('')
      : '<p style="color:var(--gray);font-size:0.85rem;padding:0.5rem 0;">No one has checked in yet.</p>';
  } catch(e) {
    document.getElementById('att-list').innerHTML = '<p style="color:var(--red);font-size:0.85rem;">' + escapeHtml(e.message) + '</p>';
  }
}
async function deleteSession(id) {
  if (!confirm('Delete this session? This cannot be undone.')) return;
  try { await YanAPI.deleteSession(id); showToast('Session deleted'); await loadSessions(); }
  catch(e) { showToast(e.message, 'error'); }
}

init();
</script>
</body>
</html>
