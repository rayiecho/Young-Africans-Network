name = "yan-ops-worker"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "yan-db"
database_id = "b62aff2e-d188-4cdf-9f53-dd7bfddc02ee"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "yan-media"

# A Worker fetching another Worker's public workers.dev URL directly gets blocked by
# Cloudflare's loop-prevention (error 1042) - same issue already fixed in content-worker
# for AI_WORKER. Service bindings route in-account instead of over the public edge.
[[services]]
binding = "EMAIL_WORKER"
service = "yan-email-worker"

[vars]
ALLOWED_ORIGINS = "https://youngafricansnetwork.org,https://young-africans-network.web.app,http://localhost:8080"
EMAIL_WORKER_URL = "https://yan-email-worker.youngafricansn.workers.dev"
MEDIA_PUBLIC_BASE = "https://pub-ea09c47ee0244611b2fc866c45f7d66b.r2.dev"

# 08:00 UTC - checks for sessions 5/3/1 days out that still aren't confirmed.
# 11:00 UTC - 6 hours before the fixed 7pm CAT session start, alerts the head with the
# confirmed attendance count.
[triggers]
crons = ["0 8 * * *", "0 11 * * *"]
